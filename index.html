<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hotwheelssshunter</title>
<meta name="description" content="Hotwheelssshunter — Hot Wheels resale store.">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <button class="menu" onclick="toggleNav()" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>

  <a class="logo" href="#home">HOTWHEELSSSHUNTER</a>

  <button class="cart-icon" onclick="openCart()" aria-label="Open cart">
    🛒<span id="cartCount">0</span>
  </button>

<nav id="nav" class="side-nav">
  <button class="nav-close" onclick="toggleNav()">×</button>

  <a href="#home" onclick="toggleNav()">🏠 Home</a>

  <a href="#stock" onclick="toggleNav()">🛒 Stock</a>

  <button onclick="openMenuPage('track')">📦 Track Order</button>

  <button onclick="openMenuPage('care')">💬 Customer Care</button>

  <button onclick="openMenuPage('login')">👤 Login / Sign In</button>

  <a
    href="https://www.instagram.com/hotwheelssshunter/"
    target="_blank"
    rel="noopener"
    onclick="toggleNav()"
  >📸 Instagram</a>
</nav>

<main id="home">

  <section class="search-section">
    <div class="search-box">
      <span>⌕</span>
      <input id="search" type="search"
        placeholder="Search Hot Wheels..."
        aria-label="Search Hot Wheels">
    </div>
  </section>

  <section class="categories section-width">
    <h2>Shop by Series</h2>

    <div class="category-grid">

      <button class="category-card"
        onclick="setCategory('mainline')">
        <img src="678EDAF0-8CF8-4625-971A-4C05031AD9D4.png"
             alt="Hot Wheels Mainline">
        <strong>Hot Wheels Mainline</strong>
        <span>›</span>
      </button>

      <button class="category-card"
        onclick="setCategory('fast-furious-silver-series')">
        <img src="61A0BA9F-D761-4522-A871-4B489074ADD4.png"
             alt="Hot Wheels Silver Series">
        <strong>Hot Wheels Silver Series</strong>
        <span>›</span>
      </button>

      <button class="category-card"
        onclick="setCategory('vintage-club')">
        <img src="1A6DAA59-D4D1-436A-A678-BE2EBC8224E9.png"
             alt="Hot Wheels Vintage Club">
        <strong>Hot Wheels Vintage Club</strong>
        <span>›</span>
      </button>

      <button class="category-card"
        onclick="setCategory('exotics')">
        <img src="5B762D5A-1C63-4B1F-9E52-9F958EBF5C66.png"
             alt="Hot Wheels Exotic">
        <strong>Hot Wheels Exotic</strong>
        <span>›</span>
      </button>

      <button class="category-card"
        onclick="setCategory('formula-1')">
        <img src="49055DF6-201A-4140-9814-A23DA03EBB94.png"
             alt="Hot Wheels 5 Pack">
        <strong>Hot Wheels 5 Pack</strong>
        <span>›</span>
      </button>

      <button class="category-card locked"
        onclick="showMessage('Premium is coming soon')">
        <div class="lock">🔒</div>
        <strong>Hot Wheels Premium</strong>
        <small>Coming Soon</small>
      </button>

    </div>
  </section>

  <section id="stock" class="stock section-width">

    <div class="section-title">
      <h2>All Stock</h2>
      <button class="clear-filter hidden"
              id="clearFilter"
              onclick="clearFilters()">
        Show All
      </button>
    </div>

    <div id="products" class="products"></div>

    <p id="empty" class="empty hidden">
      No products match your search.
    </p>

  </section>

</main>


<!-- FULL SCREEN PRODUCT PAGE -->

<div id="productPage" class="product-page hidden">

  <div class="product-page-head">

    <button onclick="closeProduct()" aria-label="Back">
      ‹
    </button>

    <span>HOTWHEELSSSHUNTER</span>

    <button onclick="openCart()" aria-label="Open cart">
      🛒
      <b id="detailCartCount">0</b>
    </button>

  </div>

  <div id="productDetail"></div>

</div>


<!-- CART -->

<div id="overlay" class="overlay hidden"
     onclick="closeCart(event)">

  <aside class="cart"
         onclick="event.stopPropagation()">

    <div class="cart-head">
      <h2>Your Cart</h2>
      <button onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      <span>Total</span>
      <strong id="total">₹0</strong>
    </div>

    <button class="checkout" onclick="checkout()">
      Checkout
    </button>

  </aside>

</div>

<!-- ACCOUNT PAGE -->
<div id="accountPage" class="account-page hidden">

  <div class="account-head">
    <button onclick="closeAccount()">‹</button>
    <span>HOTWHEELSSSHUNTER</span>
    <span></span>
  </div>

  <div class="account-box">

    <div id="loginForm">
      <h1>Welcome Back</h1>
      <p>Sign in to your Hotwheelssshunter account</p>

      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Enter your email">

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter your password">

      <button class="account-primary" onclick="signIn()">Sign In</button>

      <button class="forgot-btn" onclick="showMessage('Password recovery will be connected later')">
        Forgot Password?
      </button>

      <div class="account-divider">
        <span>OR</span>
      </div>

      <button class="account-secondary" onclick="showCreateAccount()">
        Create Account
      </button>
    </div>

    <div id="createAccountForm" class="hidden">
      <h1>Create Account</h1>
      <p>Create your Hotwheelssshunter account</p>

      <label>Name</label>
      <input id="signupName" type="text" placeholder="Enter your name">

      <label>Email</label>
      <input id="signupEmail" type="email" placeholder="Enter your email">

      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="Create a password">

      <label>Confirm Password</label>
      <input id="signupConfirm" type="password" placeholder="Confirm your password">

      <button class="account-primary" onclick="createAccount()">
        Create Account
      </button>

      <button class="forgot-btn" onclick="showLogin()">
        Already have an account? Sign In
      </button>
    </div>

  </div>
</div>
<div id="message" class="toast hidden"></div>

<script src="script.js"></script>

</body>
</html>
